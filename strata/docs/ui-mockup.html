<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>Strata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* Layout: 상단 바 + [결과 목록 | 요약 트레이] 2열, 아카이브는 [필터 | 목록 | 상세] 3열. 좁으면 1열로 쌓임 */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#E9EDE8; --ink:#18211D; --muted:#5B6862; --line:#D6DCD7;
  --accent:#2C5A4E; --accent-ink:#FFFFFF; --accent-soft:#DCE9E4; --mark:#F7E27C; --mark-ink:#18211D;
  --good:#2F7A4F; --warn:#9A6A12; --info:#3C5E8C;
  --f-title:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C2321; --surface:#242C29; --sunk:#2C3532; --ink:#E6ECE9; --muted:#A0ADA8; --line:#38423E;
  --accent:#86C7B3; --accent-ink:#0F1D18; --accent-soft:#1F3830; --mark:#5C5220; --mark-ink:#F5EBC0;
  --good:#7CCB9A; --warn:#E3B860; --info:#93B4E0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C2321; --surface:#242C29; --sunk:#2C3532; --ink:#E6ECE9; --muted:#A0ADA8; --line:#38423E;
  --accent:#86C7B3; --accent-ink:#0F1D18; --accent-soft:#1F3830; --mark:#5C5220; --mark-ink:#F5EBC0;
  --good:#7CCB9A; --warn:#E3B860; --info:#93B4E0; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:0 96px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font-family:var(--f-title);font-weight:700;font-size:19px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
.tabs{display:flex;gap:4px}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:7px;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tab .n{font-family:var(--f-mono);font-size:11px;margin-left:5px;color:var(--accent)}
.note{margin-left:auto;font-size:12px;color:var(--warn);border:1px dashed currentColor;border-radius:6px;padding:3px 8px}

/* search header */
.q{display:flex;gap:8px;margin-top:20px}
.q input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.expand{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px}
.chip.on{background:var(--accent-soft);border-color:transparent}
.chip button{border:0;background:none;padding:0;color:var(--muted);line-height:1}
.filters{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 12px;background:var(--sunk);border-radius:10px}
.src{display:inline-flex;align-items:center;gap:5px;font-size:13px}
.src .c{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:4px 10px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stat{margin:14px 2px 8px;font-size:13px;color:var(--muted)}
.stat b{color:var(--ink);font-family:var(--f-mono);font-weight:500}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:1fr}}

/* result rows */
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:14px 4px;border-bottom:1px solid var(--line)}
.row input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.title{font-family:var(--f-title);font-weight:500;font-size:16px;line-height:1.4;margin:0}
.row.sel .title span{background:linear-gradient(transparent 45%,var(--mark) 45%);color:var(--mark-ink)}
.meta{font-size:13px;color:var(--muted);margin-top:3px}
.meta i{font-style:italic}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.b{font-size:11.5px;border-radius:4px;padding:1px 6px;background:var(--sunk);color:var(--muted);font-family:var(--f-mono)}
.b.oa{color:var(--good)}
.b.saved{background:var(--accent-soft);color:var(--accent);font-family:var(--f-body);font-weight:600}
.ab{margin-top:6px;font-size:13px;color:var(--muted);max-width:72ch}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px;font-weight:500}

/* tray */
.tray{position:sticky;top:76px;background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
@media (max-width:980px){.tray{position:static;max-height:none}}
.tray-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.tray-h h2{font-size:15px;margin:0;flex:1}
.tray-b{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.empty{color:var(--muted);font-size:13px;padding:24px 8px;text-align:center}
.empty ol{text-align:left;margin:12px auto 0;max-width:260px;padding-left:18px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg)}
.card h3{font-family:var(--f-title);font-size:14.5px;font-weight:500;margin:0 0 2px;line-height:1.4}
.one{margin:8px 0;font-weight:600;font-size:14px}
dl.sum{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 10px;margin:0;font-size:13px}
dl.sum dt{color:var(--muted);font-weight:600;font-size:12px;padding-top:1px}
dl.sum dd{margin:0}
.kws{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.kw{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 7px}
.card-f{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.card-f .done{color:var(--good);font-weight:600;font-size:13px}
.skel{height:10px;border-radius:4px;background:var(--sunk);margin:8px 0;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.src-note{font-size:11.5px;color:var(--muted);margin-top:8px}

/* selection bar */
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:6;max-width:calc(100% - 32px)}
.selbar b{font-family:var(--f-mono);font-weight:500}
.selbar .btn{border-color:transparent}
.selbar .btn.ghost{color:var(--bg)}

/* archive */
.arch{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1.1fr);gap:20px;margin-top:20px;align-items:start}
@media (max-width:1100px){.arch{grid-template-columns:180px minmax(0,1fr)}.detail{grid-column:1/-1}}
@media (max-width:700px){.arch{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:18px;font-size:13px}
.side ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.side li button{width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:6px;display:flex;justify-content:space-between}
.side li button[aria-pressed="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--line);font-weight:600}
.side .c{font-family:var(--f-mono);color:var(--muted);font-size:11.5px}
.alert{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.alert .new{color:var(--info);font-weight:600}
.afind{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;margin-bottom:8px}
.arow{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 6px}
.arow[aria-current="true"]{background:var(--surface)}
.arow .title{font-size:14.5px}
.status{font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px}
.st-todo{color:var(--info);background:color-mix(in srgb,var(--info) 14%,transparent)}
.st-doing{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.st-done{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.detail h2{font-family:var(--f-title);font-size:19px;line-height:1.35;margin:0;text-wrap:balance}
.detail h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.detail textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;resize:vertical}
.detail select{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:3px 6px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
details{font-size:13px;color:var(--muted)}
details summary{cursor:pointer;color:var(--ink);font-weight:500}
pre.cite{white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:10px;border-radius:8px;margin:8px 0 0}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font-weight:500;z-index:7}
@media (max-width:600px){.wrap{padding-inline:16px}.top-in{padding:10px 16px}.note{margin-left:0}}
/* 분야 7개: 범주색 (점으로만 쓰고 글자는 --ink) */
:root{--fd-edu:#8A6326;--fd-et:#2F6F9F;--fd-ls:#2E7D5B;--fd-cog:#8A4F8F;--fd-kor:#B0452F;--fd-eval:#3F6474;--fd-dig:#B07200}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fd-edu:#D8B57E;--fd-et:#8EC0E8;--fd-ls:#84CFA8;--fd-cog:#D3A0D8;--fd-kor:#EE9A86;--fd-eval:#9FC0CE;--fd-dig:#F0BE5C}}
:root[data-theme="dark"]{--fd-edu:#D8B57E;--fd-et:#8EC0E8;--fd-ls:#84CFA8;--fd-cog:#D3A0D8;--fd-kor:#EE9A86;--fd-eval:#9FC0CE;--fd-dig:#F0BE5C}
.fd{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink);font-weight:500}
.fd::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--muted)}
.fchip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.35}
.fchip[aria-pressed="true"]{color:var(--ink);border-color:var(--c)}
.fchip[aria-pressed="true"]::before{opacity:1}
.side li button .fd{font-size:13px}
.lang{font-size:11px;font-family:var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
/* v0.3 — 레이아웃: [프로젝트 사이드바 | 프로젝트 화면]. 프로젝트 화면은 머리말 → 큰 검색창 → 탭(검색 결과 | 비교표) */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.nav{border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--bg)}
.nav .brand{padding:0 6px}
.nav ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav li button{width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:7px;display:flex;gap:8px;align-items:baseline;justify-content:space-between;color:var(--ink)}
.nav li button span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav li button[aria-current="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--line);font-weight:600}
.nav .c{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.nav .newp{border:1px dashed var(--line);color:var(--muted)}
.nav .note{margin:0;align-self:flex-start}
.main{min-width:0;padding-inline:28px;padding-block:22px 110px}
.phead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
.phead h1{font-family:var(--f-title);font-size:24px;margin:0;line-height:1.3;text-wrap:balance}
.rq{margin:6px 0 0;color:var(--muted);max-width:80ch;font-size:13.5px}
.rq b{color:var(--ink);font-weight:600}
.alertbar{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.alertbar .new{color:var(--info);font-weight:600}
.bigq{margin-top:18px;display:flex;gap:8px;background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:6px 6px 6px 16px;align-items:center}
.bigq input{flex:1;min-width:0;border:0;background:transparent;font-size:18px;padding:8px 0;outline:none}
.bigq:focus-within{box-shadow:0 0 0 4px var(--accent-soft)}
.bigq .btn{padding:10px 18px;font-size:15px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:20px}
.ptab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.ptab .n{font-family:var(--f-mono);font-size:12px;margin-left:6px;font-weight:500}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:14px 0 6px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.cmp{border-collapse:collapse;width:100%;min-width:980px;font-size:13px}
.cmp th{position:sticky;top:0;background:var(--sunk);text-align:left;font-size:11.5px;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.cmp td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp tr.grp td{background:var(--bg);font-weight:600;font-size:12.5px;color:var(--accent);padding:7px 10px}
.cmp tr.item{cursor:pointer}
.cmp tr.item:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.cmp .ttl{font-family:var(--f-title);font-size:13.5px;line-height:1.4}
.cmp .who{color:var(--muted);font-size:12px;margin-top:2px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
tr.open .clamp{-webkit-line-clamp:unset}
.inproj{font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px}
.cardsel{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:3px 6px;font-size:13px}
.lib-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px;gap:10px}
  .nav ul{flex-direction:row;overflow-x:auto;gap:6px}
  .nav li button{white-space:nowrap;border:1px solid var(--line)}
  .nav .sec-hide{display:none}
  .main{padding-inline:16px}
  .grid{grid-template-columns:1fr}
}
.tray{top:16px;max-height:calc(100vh - 32px)}
[hidden]{display:none!important}
.fd,.status{white-space:nowrap}
.imp{font-size:11.5px;border-radius:4px;padding:1px 7px;font-weight:600;white-space:nowrap}
.imp-1{background:var(--accent);color:var(--accent-ink)}
.imp-10{background:var(--accent-soft);color:var(--accent)}
.imp-n{background:var(--sunk);color:var(--muted)}
.imp-new{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.themes{display:flex;flex-direction:column;gap:6px}
.themes .seg button{padding:4px 9px}
.core{margin-top:14px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px}
.core h3{margin:0;font-size:14px}
.core ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.core li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.core .why{font-size:12px;color:var(--info);font-weight:600}
details.legend{margin:2px 0 10px}
details.legend dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;margin:10px 0 0;font-size:12.5px;max-width:860px}
details.legend dt{color:var(--ink);font-weight:600}
@media (max-width:600px){details.legend dl{grid-template-columns:1fr}}
/* v0.5 — 대시보드 · 관계도 · 설정 · 로그인 */
.acct{margin-top:auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;width:100%}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.acct small{display:block;color:var(--muted);font-size:11.5px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .k{font-size:12px;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--f-mono);font-size:26px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;color:var(--muted)}
.tile .d{font-size:12px;color:var(--muted);margin-top:2px}
.dash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:900px){.dash{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.panel h3{margin:0 0 2px;font-size:14px}
.panel .sub{font-size:12px;color:var(--muted);margin:0 0 10px}

function trendHTML(x){const T=trendFor(x);
  return `<div class="panel wide trend"><h3>연구 동향</h3><p class="sub">확장 검색어별 연도별 출판 논문 수 (OpenAlex 전체 집계, 예시 값). 이 주제가 떠오르는 중인지, 이미 정점을 지났는지 봅니다.</p>
    <div class="legend-row" style="margin:0 0 6px">${T.terms.map((t,i)=>`<span><span class="sw3" style="background:var(--s${i+1})"></span>${esc(t)}</span>`).join('')}</div>
    <div class="trendwrap" id="trendWrap"></div>
    <div class="insight">${T.terms.map((t,i)=>{const a=T.series[i];const last5=a.slice(-5).reduce((p,c)=>p+c,0),prev5=a.slice(-10,-5).reduce((p,c)=>p+c,0);const ch=prev5?Math.round((last5-prev5)/prev5*100):0;
      return `<span><span class="sw3" style="background:var(--s${i+1})"></span>${esc(t)}: 최근 5년 <b>${ch>=0?'+':''}${ch}%</b> ${ch>=30?'↑ 성장 중':ch<=-10?'↓ 감소':'→ 유지'}</span>`}).join('')}</div></div>`}
function bindTrend(x){const wrap=$('#trendWrap');if(!wrap)return;const T=trendFor(x);
  const W=900,H=250,L=44,R=200,Tp=14,B=28;const ymaxRaw=Math.max(...T.series.flat());const step=ymaxRaw>200?100:ymaxRaw>80?40:20;const ymax=Math.ceil(ymaxRaw/step)*step;
  const sx=i=>L+i/(T.years.length-1)*(W-L-R), sy=v=>Tp+(1-v/ymax)*(H-Tp-B);
  let g='';for(let v=0;v<=ymax;v+=step)g+=`<line class="t-grid" x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}"/><text class="t-axis" x="${L-6}" y="${sy(v)+4}" text-anchor="end">${v}</text>`;
  T.years.forEach((y,i)=>{if(y%5===0)g+=`<text class="t-axis" x="${sx(i)}" y="${H-8}" text-anchor="middle">${y}</text>`});
  const ends=T.series.map((a,i)=>({i,y:sy(a[a.length-1])})).sort((p,q)=>p.y-q.y);for(let k=1;k<ends.length;k++)if(ends[k].y-ends[k-1].y<16)ends[k].y=ends[k-1].y+16;
  T.series.forEach((a,i)=>{g+=`<path class="t-line" stroke="var(--s${i+1})" d="${a.map((v,j)=>`${j?'L':'M'}${sx(j)},${sy(v)}`).join('')}"/>`;
    const e=ends.find(z=>z.i===i);g+=`<circle cx="${sx(a.length-1)}" cy="${sy(a[a.length-1])}" r="4" fill="var(--s${i+1})" stroke="var(--surface)" stroke-width="2"/><text class="t-end" x="${sx(a.length-1)+10}" y="${e.y+4}">${esc(T.terms[i].length>24?T.terms[i].slice(0,23)+'…':T.terms[i])}</text>`});
  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="연구 동향 선 그래프">${g}<line class="t-cross" id="tCross" x1="0" x2="0" y1="${Tp}" y2="${H-B}" visibility="hidden"/><rect id="tHit" x="${L}" y="${Tp}" width="${W-L-R}" height="${H-Tp-B}" fill="transparent"/></svg>`;
  const svg=wrap.querySelector('svg'),hit=svg.querySelector('#tHit'),cross=svg.querySelector('#tCross'),tip=$('#tip');
  hit.addEventListener('mousemove',ev=>{const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)/r.width*W;const j=Math.max(0,Math.min(T.years.length-1,Math.round((px-L)/(W-L-R)*(T.years.length-1))));
    cross.setAttribute('x1',sx(j));cross.setAttribute('x2',sx(j));cross.setAttribute('visibility','visible');
    tip.innerHTML=`<b>${T.years[j]}년</b><br>`+T.terms.map((t,i)=>`<span class="sw3" style="background:var(--s${i+1})"></span>${esc(t)}: ${T.series[i][j]}편`).join('<br>');tip.hidden=false;
    tip.style.left=Math.min(ev.clientX+14,innerWidth-300)+'px';tip.style.top=(ev.clientY+14)+'px'});
  hit.addEventListener('mouseleave',()=>{cross.setAttribute('visibility','hidden');tip.hidden=true});
}

  const links=EDGES.filter(([a,b])=>set.has(a)&&set.has(b)).map(([a,b])=>({a,b}));

}
const rOf=c=>6+Math.log10(c+1)*3.2;
function forceLayout(nodes,links,W,H){
  const N=nodes.length;nodes.forEach((n,i)=>{const ang=i/N*Math.PI*2;n.x=W/2+Math.cos(ang)*W*.3;n.y=H/2+Math.sin(ang)*H*.3;n.vx=0;n.vy=0});
  const idx=Object.fromEntries(nodes.map((n,i)=>[n.id,i]));
  for(let it=0;it<500;it++){const k=1-it/500;
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const A=nodes[i],B=nodes[j];let dx=A.x-B.x,dy=A.y-B.y,d2=dx*dx+dy*dy+.01,f=26000/d2;const d=Math.sqrt(d2);dx/=d;dy/=d;A.vx+=dx*f;A.vy+=dy*f;B.vx-=dx*f;B.vy-=dy*f}
    links.forEach(l=>{const A=nodes[idx[l.a]],B=nodes[idx[l.b]];let dx=B.x-A.x,dy=B.y-A.y,d=Math.sqrt(dx*dx+dy*dy)+.01,f=(d-190)*.02;A.vx+=dx/d*f;A.vy+=dy/d*f;B.vx-=dx/d*f;B.vy-=dy/d*f});
    nodes.forEach(n=>{n.vx+=(W/2-n.x)*.002;n.vy+=(H/2-n.y)*.004;n.x+=n.vx*.5*k;n.y+=n.vy*.5*k;n.vx*=.6;n.vy*=.6;n.x=Math.max(40,Math.min(W-150,n.x));n.y=Math.max(30,Math.min(H-30,n.y))})}
}
function renderGraph(){
  const x=proj();const {nodes,links}=graphData(x);
  const W=900;let H, body='';
  const pos={};
  if(graphMode==='net'){
    H=480;forceLayout(nodes,links,W,H);nodes.forEach(n=>pos[n.id]=n);
    const R=Object.fromEntries(nodes.map(n=>[n.id,rOf(n.c)]));
    body+=links.map(l=>{const A=pos[l.a],B=pos[l.b];const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1,ra=R[l.a]+2,rb=R[l.b]+4;
      return `<line class="g-edge" data-e="${l.a}|${l.b}" x1="${A.x+dx/d*ra}" y1="${A.y+dy/d*ra}" x2="${B.x-dx/d*rb}" y2="${B.y-dy/d*rb}" marker-end="url(#arr)"/>`}).join('');
  }else{
    const lanes=x.subs, laneH=96, top=34, left=170, right=30; H=top+lanes.length*laneH+30;
    const x0=1970,x1=2030, sx=yv=>left+(yv-x0)/(x1-x0)*(W-left-right);
    lanes.forEach((s,i)=>{body+=`<rect class="g-lane" x="0" y="${top+i*laneH+2}" width="${W}" height="${laneH-4}"/><text class="g-lane-lab" x="12" y="${top+i*laneH+laneH/2+4}">${esc(s.length>12?s.slice(0,12)+'…':s)}</text>`});
    for(let yv=x0;yv<=x1;yv+=10)body+=`<line class="g-grid" x1="${sx(yv)}" y1="${top}" x2="${sx(yv)}" y2="${H-24}"/><text class="g-axis" x="${sx(yv)}" y="${H-8}" text-anchor="middle">${yv}</text>`;
    const laneCount={};
    nodes.sort((a,b)=>a.y-b.y).forEach(n=>{const li=Math.max(0,lanes.indexOf(n.sub));const k=laneCount[li]=(laneCount[li]||0)+1;n.x=sx(n.y);const up=k%2===1;n.y2=top+li*laneH+laneH/2+(up?-12:12);pos[n.id]={x:n.x,y:n.y2,up}});
    const R=Object.fromEntries(nodes.map(n=>[n.id,rOf(n.c)]));
    body+=links.map(l=>{const A=pos[l.a],B=pos[l.b];const ax=A.x-R[l.a]-2,bx=B.x+R[l.b]+4,mx=(ax+bx)/2;return `<path class="g-edge" data-e="${l.a}|${l.b}" d="M${ax},${A.y} C${mx},${A.y} ${mx},${B.y} ${bx},${B.y}" marker-end="url(#arr)"/>`}).join('');
  }

    const lab=graphMode==='time'?`x="${P.x}" y="${P.up?P.y-r-5:P.y+r+14}" text-anchor="middle"`:`x="${P.x+r+4}" y="${P.y+4}"`;
    return `<g data-node="${n.id}"><circle class="g-node ${n.cand?'cand':''}" cx="${P.x}" cy="${P.y}" r="${r}" data-n="${n.id}"/><text class="g-lab ${n.cand?'cand':''}" ${lab}>${esc(n.label)}</text></g>`}).join('');
  $('#tabBody').innerHTML=`
  <div class="toolbar"><span class="seg">${[['net','관계망'],['time','연도 계보']].map(([k,v])=>`<button type="button" data-gm="${k}" aria-pressed="${graphMode===k}">${v}</button>`).join('')}</span>
    <span class="hint" style="margin:0">${graphMode==='net'?'서로 인용하는 논문끼리 가까이 모입니다. 점을 누르면 연결된 논문만 강조됩니다.':'가로는 출판 연도, 세로 줄은 소주제입니다. 어떤 연구가 무엇을 바탕으로 나왔는지 흐름이 보입니다.'}</span></div>

function graphFocus(id){

  if(t.dataset.export){const x=proj();const ids=Object.keys(x.items);let txt;
    if(t.dataset.export==='tsv')txt=['소주제\t논문\t영향력\t대상\t설계\t주요 결과\t시사점',...ids.map(i=>{const p=byId[i];return [x.items[i],`${lastName(p.a)} (${p.y}) ${p.t}`,IMP[i].pct!=null?`상위 ${Math.max(1,Math.round(100-IMP[i].pct))}%`:'-',p.s.who,p.s.des,p.s.res,p.s.imp].join('\t')})].join('\n');
    else txt=ids.map(i=>apa(byId[i])).sort().join('\n');
    const out=$('#citeOut');out.textContent=txt;out.hidden=false;copy(txt)}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='onlyTop'){onlyTop=el.checked;renderResults()}
  if(el.id==='onlyReview'){onlyReview=el.checked;renderResults()}
  if(el.dataset.ck){el.checked?sel.add(el.dataset.ck):sel.delete(el.dataset.ck);el.closest('.row').classList.toggle('sel',el.checked);updateSel()}
  if(el.dataset.sub){const z=tray.find(q=>q.id===el.dataset.sub);if(el.value==='__new'){toast('새 소주제 이름을 입력하는 자리');el.value=z.sub}else z.sub=el.value}
  if(el.dataset.addto&&el.value){const x=projects.find(o=>o.id===el.value);x.items[el.dataset.addto]=x.subs[0];toast(`${x.name}에 추가했습니다`);render()}
  if(el.dataset.eng)engine=el.dataset.eng;
});
document.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='qform'){const st=PS[proj().id];st.searched=true;st.tab='results';renderProject();toast('시안에서는 예시 결과만 보여줍니다')}
  if(e.target.id==='inviteForm'){const v=$('#inviteEmail').value.trim();toast(v?`${v} 님에게 초대 메일을 보냈다고 안내하는 자리`:'초대할 이메일을 입력하세요')}
  if(e.target.id==='loginForm')toast('이메일로 로그인 링크를 보냈다고 안내하는 자리');
});
// 차트·관계도 툴팁
document.addEventListener('mouseover',e=>{const tip=$('#tip');const el=e.target.closest('[data-tip],circle[data-n]');
  if(!el){tip.hidden=true;return}
  if(el.dataset.n){const id=el.dataset.n,p=byId[id]||CANDS[id];const x=proj();const cand=!x.items[id];
    tip.innerHTML=`<b>${esc(p.t)}</b><br>${esc(p.a)} (${p.y})<br>피인용 ${p.c.toLocaleString()}${cand?'<br>아직 보관하지 않은 핵심 후보':`<br>소주제: ${esc(x.items[id])}`}`}
  else tip.textContent=el.dataset.tip;
  tip.hidden=false});
document.addEventListener('mousemove',e=>{const tip=$('#tip');if(tip.hidden)return;tip.style.left=Math.min(e.clientX+14,innerWidth-300)+'px';tip.style.top=(e.clientY+14)+'px'});
applyTheme();render();
</script>

</body>
</html>
